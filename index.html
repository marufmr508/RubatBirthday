<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@100..900&display=swap"
      rel="stylesheet"
    />
    />
  </head>
  <body class="bg-purple-200 [font-family: Noto Sans Bengali, sans-serif]">
    <section
      class="grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 mt-2.5 mx-auto p-4 container grid gap-4"
    >
      <div class="rounded-3xl">
        <img
          class="rounded-3xl"
          src="./asset/purple2.png"
          alt="Happy Birthday"
        />
      </div>
      <div class="rounded-3xl">
        <img
          class="rounded-3xl"
          src="./asset/purple1.png"
          alt="Happy Birthday"
        />
      </div>
      <div class="rounded-3xl">
        <h1
          class="text-center text-4xl font-bold text-gray-800 mb-4"
          style="font-family: &quot;Noto Sans Bengali&quot;, sans-serif"
        >
          " জানিনা কোথায় তুমি কেন যে দূরে হারিয়ে কেন যে আছো লুকিয়ে আজো আছি
          তোমারই হয়ে"
        </h1>
        <p class="font-bangla text-center text-lg text-gray-600">
          Wishing you a fantastic birthday!
        </p>
        <img class="rounded-3xl" src="./asset/png.png" alt="Happy Birthday" />
      </div>
    </section>
  </body>
</html>
